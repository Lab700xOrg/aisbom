name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Verification Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev

      # Catch a detection regression at PR time rather than at release time,
      # when the fix is cheap and the author still has the context.
      - name: Bypass scorecard must not regress
        run: poetry run aisbom bypass-scorecard --check

      - name: Smoke Test #1 - Generate test artifacts
        run: poetry run aisbom generate-test-artifacts
        
      - name: Run Automated Tests
        run: poetry run pytest
        
      - name: Smoke Test #2 - Check Coverage
        run: poetry run pytest --cov=aisbom --cov-fail-under=85
        
      - name: Smoke Test #3 - Info
        run: poetry run aisbom info
        
      - name: Smoke Test #4 - Standard Scan
        run: poetry run aisbom scan demo_data --no-fail-on-risk --format markdown
        
      - name: Smoke Test #5 - Strict Mode Scan
        run: poetry run aisbom scan demo_data --strict --no-fail-on-risk --format markdown
        
      - name: Smoke Test #6 - Remote Scan (HuggingFace)
        run: poetry run aisbom scan hf://google-bert/bert-base-uncased --no-fail-on-risk --format markdown
        
      - name: Smoke Test #7 - Scan Current Directory (Artifacts)
        run: poetry run aisbom scan . --no-fail-on-risk --format markdown
        
      - name: Smoke Test #8 - Drift Detection (Diff)
        run: poetry run aisbom diff demo_data/sbom_baseline.json demo_data/sbom_drifted.json --no-fail-on-risk-increase
        
      - name: Smoke Test #9 - Migration Linting
        run: poetry run aisbom scan mock_broken.pt --lint --no-fail-on-risk
        
      - name: Smoke Test #10 - Compliance Export (SPDX & CycloneDX)
        run: |
          poetry run aisbom scan . --format spdx --output sbom.spdx.json --no-fail-on-risk
          poetry run aisbom scan . --format spdx --spdx-version 3.0 --output sbom.spdx3.json --no-fail-on-risk
          poetry run aisbom scan . --format json --output sbom.json --no-fail-on-risk

      - name: Smoke Test #11 - VEX Export (OpenVEX & CycloneDX VEX)
        run: |
          poetry run aisbom scan . --vex --output vex-sbom.json --no-fail-on-risk
          test -s vex-sbom.openvex.json
          test -s vex-sbom.vex.cdx.json
          poetry run aisbom scan . --vex --vex-baseline vex-sbom.json --output vex-rescan.json --no-fail-on-risk

      # Exercises all three input routes and both gate outcomes. `--fail-under 0`
      # must pass and `--fail-under 101` must exit 2, so a gate that silently
      # stopped gating would fail the build rather than going unnoticed.
      - name: Smoke Test #12 - Completeness Score
        run: |
          poetry run aisbom score sbom.json
          poetry run aisbom score sbom.json --json
          poetry run aisbom score . --json
          poetry run aisbom score vex-sbom.json --fail-under 0
          if poetry run aisbom score sbom.json --fail-under 101; then
            echo "::error::--fail-under did not gate on a failing score"; exit 1
          fi
