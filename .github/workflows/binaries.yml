name: Build Standalone Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Same release gate as publish.yml. Standalone binaries are a distribution
  # channel like any other, so a regressed scanner must not reach users through
  # this door either.
  gate:
    if: startsWith(github.event.release.tag_name, 'v1.')
    name: Release gate (tests + bypass scorecard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      # --with dev: the corpus needs py7zr to build the 7z container case.
      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

      - name: Bypass scorecard must not regress
        run: poetry run aisbom bypass-scorecard --check

  build-and-upload:
    # Build CLI binaries for v1.x.x releases (aligned CLI + Action).
    if: startsWith(github.event.release.tag_name, 'v1.')
    needs: gate
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: aisbom-linux-amd64
            python_arch: x64
          - os: macos-14 # Run Intel build on M1 via Rosetta 2
            asset_name: aisbom-macos-amd64
            python_arch: x64 
          - os: macos-14 # Run Silicon build natively
            asset_name: aisbom-macos-arm64
            python_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" 
          architecture: ${{ matrix.python_arch }} 

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev

      - name: Build binary
        run: ./scripts/build_binaries.sh

      - name: Rename binary
        shell: bash
        run: |
          mv dist/aisbom dist/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
