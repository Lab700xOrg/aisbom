name: Publish to PyPI

# Trigger this action ONLY when a Release is published in the GitHub UI
on:
  release:
    types: [published]

jobs:
  # Release gate. Nothing reaches PyPI until the suite passes AND the pickle-
  # evasion scorecard is at or above its committed floor. A scanner that has
  # quietly stopped catching a known bypass must not ship: the release still
  # looks green everywhere else, which is exactly why this has to block here
  # rather than rely on someone reading a report.
  gate:
    if: startsWith(github.event.release.tag_name, 'v1.')
    name: Release gate (tests + bypass scorecard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      # --with dev: the corpus needs py7zr to build the 7z container case.
      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

      - name: Bypass scorecard must not regress
        run: poetry run aisbom bypass-scorecard --check

  build-and-publish:
    # Only fire for CLI releases (v1.x.x). CLI and GitHub Action releases
    # are now aligned.
    if: startsWith(github.event.release.tag_name, 'v1.')
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Check out the code
      - uses: actions/checkout@v7

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 3. Install Poetry
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Install Dependencies (Optional, mostly for sanity check)
      - name: Install dependencies
        run: poetry install

      # 5. Build and Publish using the Secret
      - name: Publish to PyPI
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: poetry publish --build
      
      # 6. Update Major Version Tag (e.g. v1)
      - name: Update Major Version Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1
          git push origin v1 --force
      
      # 7. Notify ai-sbom-platform to regenerate changelog
      - name: Notify ai-sbom-platform to regenerate changelog
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.LANDING_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Lab700xOrg/ai-sbom-platform/dispatches \
            -d '{"event_type":"aisbom-cli-released","client_payload":{"tag":"${{ github.ref_name }}"}}'