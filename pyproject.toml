[tool.poetry]
name = "aisbom-cli"
version = "1.5.0"
description = "Static security scanner for ML model files — detects pickle bombs, Keras Lambda RCE and GGUF template injection, and generates CycloneDX / SPDX AI-BOMs (AIBOM) as EU AI Act, CRA and FDA §524B evidence."
authors = ["Ajoy L <lab700xdev@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
# Discovery metadata: PyPI renders keywords as facets and classifiers as
# sidebar filters, so the high-intent terms buyers actually search for
# ("aibom", "eu-ai-act", "mlsecops") have to appear here, not only in the
# README. Additive only — none of this affects resolution or runtime.
keywords = [
    "sbom",
    "aibom",
    "ai-bom",
    "mlbom",
    "ml-bom",
    "cyclonedx",
    "spdx",
    "vex",
    "ai-security",
    "machine-learning-security",
    "mlsecops",
    "model-scanning",
    "malware-detection",
    "pickle",
    "supply-chain-security",
    "eu-ai-act",
    "cra",
    "huggingface",
    "pytorch",
    "onnx",
    "gguf",
    "safetensors",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
]
packages = [{include = "aisbom"}]
repository = "https://github.com/Lab700xOrg/aisbom"
urls = { "Homepage" = "https://www.aisbom.io/" }
[tool.poetry.dependencies]
python = "^3.11"
typer = {extras = ["all"], version = ">=0.27.2,<0.28.0"}
rich = ">=13.7.1,<16.0.0"
# Floor is 11.4, the first release exporting JsonV1Dot7 / SchemaVersion.V1_7
# (upstream PR #902). cli.py imports the 1.7 serializer unconditionally, so a
# resolver that left an older-but-previously-allowed version installed would
# break the CLI at startup for every format, not just 1.7 output.
cyclonedx-python-lib = ">=11.4,<12.0"
pip-requirements-parser = "^32.0.1"
click = "<8.6.0"
spdx-tools = "^0.8.3"
packaging = ">=24,<27"

[tool.poetry.dependencies.requests]
version = "^2.32.3"
[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.3,<10.0.0"
pytest-cov = ">=6,<8"
pyinstaller = {version = "^6.18.0", python = "<3.15"}
py7zr = "^1.1.3"
h5py = "^3.12"
onnx = "^1.17"
# Fixture builders only. The scanner never imports these: joblib containers are
# decompressed with the stdlib and .npy headers are parsed by hand, precisely so
# the shipped wheel and the standalone binaries stay free of them. They exist
# here to generate realistic artifacts and to cross-validate the hand-written
# parsers in both directions.
joblib = "^1.4"
dill = ">=0.3.8,<0.5.0"
numpy = "^2.0"
# cyclonedx-python-lib's `validation` extra. Test-only on purpose: the CLI
# never validates its own output at runtime (that would add a hard dependency
# and a per-scan cost to every user), but the 1.7 modelCard block is spliced
# into the serialized JSON outside the library's type system, so the suite
# validates generated SBOMs against the bundled schema instead.
jsonschema = "^4.23"
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
aisbom = "aisbom.cli:app"

[tool.pytest.ini_options]
addopts = "--cov=aisbom --cov-fail-under=85"

